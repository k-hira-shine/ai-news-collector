<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI News Collector — ホーム</title>
<style>
  :root {
    --bg: #0a0f1e; --surface: #111827; --card: #1a2236;
    --accent: #38bdf8; --accent2: #0284c7; --text: #e2e8f0;
    --muted: #94a3b8; --border: #2d3748;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; min-height: 100vh; padding-top: 48px; }

.topnav { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: #0a0f1eee; backdrop-filter: blur(8px); border-bottom: 1px solid #2d3748; display: flex; gap: 0.4rem; justify-content: center; flex-wrap: wrap; padding: 6px 12px; }
.topnav a { display: inline-block; padding: 4px 12px; background: #1a2236; border-radius: 6px; color: #94a3b8; text-decoration: none; font-size: 0.82rem; white-space: nowrap; }
.topnav a:hover { color: #38bdf8; background: rgba(56,189,248,0.1); }
.topnav a.active { background: #0284c7; color: #fff; }
@media (max-width: 640px) {
  .topnav { gap: 4px; padding: 4px 8px; }
  .topnav a { font-size: 0.75rem; padding: 3px 8px; }
}

  header { background: linear-gradient(135deg, #0c1a35, #0a0f1e); padding: 22px 32px 18px; border-bottom: 1px solid var(--border); text-align: center; }
  .site-title { font-size: 1.6rem; font-weight: 800; color: var(--accent); }
  .site-sub { font-size: 0.82rem; color: var(--muted); margin-top: 5px; }
  .site-updated { font-size: 0.72rem; color: #4b5563; margin-top: 4px; }
  .container { max-width: 860px; margin: 0 auto; padding: 28px 16px; display: flex; flex-direction: column; gap: 32px; }
  /* セクションタイトル */
  .section-label { font-size: 0.78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  /* 機能リスト */
  .feature-list { display: flex; flex-direction: column; gap: 10px; }
  .feature-row {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    display: flex; flex-direction: column;
    border-left: 3px solid var(--row-color, var(--border));
    overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .feature-row:hover { border-color: var(--row-color); box-shadow: 0 2px 12px rgba(0,0,0,0.3); }
  .row-main {
    padding: 14px 18px 10px; text-decoration: none; color: var(--text);
    display: flex; flex-direction: column; gap: 5px;
  }
  .row-main:hover .row-title { color: var(--row-color); }
  .row-line1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row-title { font-size: 1rem; font-weight: 700; color: var(--row-color); transition: opacity 0.15s; }
  .row-updated { font-size: 0.68rem; color: #4b5563; margin-left: auto; }
  .row-line2 { font-size: 0.82rem; color: var(--muted); line-height: 1.55; }
  .row-line3 {
    font-size: 0.78rem; color: #64748b;
    padding: 7px 18px; border-top: 1px solid var(--border);
    background: rgba(0,0,0,0.15);
    display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap;
  }
  .row-topic-text { color: #94a3b8; flex: 1; line-height: 1.4; }
  .row-topic-link { color: var(--muted); font-size: 0.72rem; text-decoration: none; flex-shrink: 0; }
  .row-topic-link:hover { color: var(--accent); }
  .row-topic-empty { color: #374151; }
  .diagram-chip { font-size: 0.7rem; background: rgba(56,189,248,0.08); border: 1px solid rgba(56,189,248,0.25); color: var(--accent); padding: 2px 8px; border-radius: 20px; text-decoration: none; white-space: nowrap; }
  .diagram-chip:hover { background: rgba(56,189,248,0.18); }
  /* git ログ */
  .log-section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .log-row { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid rgba(45,55,72,0.5); font-size: 0.8rem; }
  .log-row:last-child { border-bottom: none; }
  .log-date { color: var(--muted); min-width: 76px; flex-shrink: 0; }
  .log-sha { font-family: monospace; font-size: 0.72rem; color: #4b5563; flex-shrink: 0; }
  .log-subject { color: var(--text); }
  .log-empty { color: var(--muted); font-size: 0.82rem; }
  footer { text-align: center; color: var(--muted); font-size: 0.75rem; padding: 24px; border-top: 1px solid var(--border); }
  @media (max-width: 600px) {
    header { padding: 14px 12px; }
    .site-title { font-size: 1.3rem; }
    .row-updated { margin-left: 0; }
  }

.incident-mount-wrap { max-width: 960px; margin: 52px auto 0; padding: 0 1rem; width: 100%; box-sizing: border-box; }
.incident-card { background: var(--inc-bg, rgba(248,113,113,0.12)); border: 1px solid var(--inc-border, #f87171); border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
.incident-head { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; }
.incident-icon { font-size: 1.25rem; }
.incident-title { font-size: 1.05rem; color: var(--inc-border, #f87171); margin: 0; }
.incident-dl { margin: 0; font-size: 0.9rem; }
.incident-dl dt { font-weight: 700; color: var(--text, #e2e8f0); margin-top: 0.65rem; }
.incident-dl dt:first-of-type { margin-top: 0; }
.incident-dl dd { margin: 0.2rem 0 0 0; color: var(--muted, #94a3b8); line-height: 1.55; }
.incident-tech { font-size: 0.78rem; color: var(--muted, #94a3b8); margin: 0.75rem 0 0; word-break: break-word; }
.incident-tech span { font-weight: 600; color: var(--text, #e2e8f0); }
.incident-meta { font-size: 0.75rem; color: var(--muted, #94a3b8); margin: 0.35rem 0 0; }

.incident-mount-wrap { margin: 1rem auto 1.5rem; }
</style>
</head>
<body>
<nav class="topnav">
  <a href="index.html">📰 ニュース</a>
</nav>
<header>
  <div class="site-title">🤖 AI News Collector</div>
  <div class="site-sub">RSS・X・HackerNews・arxivから自動収集 → Geminiが分析・整理</div>
  <div class="site-updated">Generated: 2026-07-26 01:20 JST</div>
</header>

<div id="incidentMount" class="incident-mount-wrap" style="display:none" aria-live="polite"></div>
<script>
(function() {
  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function cardHtml(inc) {
    var sev = inc.severity === 'critical';
    var border = sev ? '#f87171' : '#fbbf24';
    var bg = sev ? 'rgba(248,113,113,0.12)' : 'rgba(251,191,36,0.12)';
    var icon = sev ? '🚨' : '⚠️';
    var impact = esc(inc.impact).replace(/\n/g, '<br>');
    var diagram = inc.diagram_latest
      ? '<p class="incident-meta">表示中の最新図解: <strong>' + esc(inc.diagram_latest) + '</strong></p>' : '';
    return '<div class="incident-card" role="alert" style="--inc-border:' + border + ';--inc-bg:' + bg + '">'
      + '<div class="incident-head"><span class="incident-icon">' + icon + '</span>'
      + '<h2 class="incident-title">' + esc(inc.title) + '</h2></div>'
      + '<dl class="incident-dl"><dt>状況</dt><dd>' + esc(inc.situation) + '</dd>'
      + '<dt>原因</dt><dd>' + esc(inc.cause) + '</dd>'
      + '<dt>影響</dt><dd>' + impact + '</dd></dl>' + diagram
      + '<p class="incident-tech"><span>技術メモ:</span> ' + esc(inc.technical) + '</p>'
      + '<p class="incident-meta">記録: ' + esc(inc.updated_at) + '</p></div>';
  }
  function fallbackIncident(data) {
    var bad = Object.entries(data.workflows || {}).filter(function(e) { return e[1].status !== 'success'; });
    if (!bad.length) return null;
    var lines = bad.map(function(e) { return e[0] + ': ' + (e[1].error || e[1].status); });
    return {
      active: true, severity: data.overall === 'error' ? 'critical' : 'warning',
      title: lines[0].slice(0, 120),
      situation: '直近の自動実行で warning / error が記録されています。',
      cause: lines.join(' / '),
      impact: '該当機能の更新が止まっている可能性があります。詳細はログを確認してください。',
      technical: '', updated_at: data.updated_at || ''
    };
  }
  fetch('run_status.json?_=' + Date.now())
    .then(function(r) { return r.ok ? r.json() : null; })
    .catch(function() { return null; })
    .then(function(data) {
      if (!data) return;
      var mount = document.getElementById('incidentMount');
      var inc = data.incident;
      if (!inc || !inc.active) {
        if (data.overall !== 'success') inc = fallbackIncident(data);
      }
      if (inc && (inc.active === true || inc.active === 'true' || inc.active === 1)) {
        if (mount) {
          mount.innerHTML = cardHtml(inc);
          mount.style.display = 'block';
        }
      }
    });
})();
</script>

<div class="container">
  <div>
    <div class="section-label">機能一覧</div>
    <div class="feature-list">
      <div class="feature-row" style="--row-color:#38bdf8">
  <a href="index.html" class="row-main">
    <div class="row-line1">
      <span class="row-title">📰 ニュース</span>
    </div>
    <div class="row-line2">RSS・X・HNから収集したAI関連ニュースを毎日自動更新。Geminiがトレンド分析・要約を生成</div>
  </a>
  <div class="row-line3">💬 最新: <span class="row-topic-text">Opus 5がClaudeプラットフォームで公開</span><a href="https://x.com/ClaudeDevs/status/2080703243722854516" target="_blank" rel="noopener" class="row-topic-link">↗</a> <a href="diagrams/2026-07-26-morning.html" class="diagram-chip" target="_blank" rel="noopener" onclick="event.stopPropagation()">📊 最新図解: 2026-07-26-morning</a></div>
</div>

    </div>
  </div>
  <div class="log-section">
    <div class="section-label" style="margin-bottom:10px">🕐 最近の更新</div>
    <div class="log-empty">ログが取得できませんでした</div>
  </div>
</div>
<footer>AI News Collector — 自動収集・分析パイプライン</footer>
</body>
</html>
