name: Rebuild Reviews Page

on:
  push:
    paths:
      - 'data/reviews.json'

concurrency:
  group: repo-data-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Rebuild reviews and tools pages
        run: |
          python build_reviews.py
          python build_tools.py
          python build_home.py

      - name: Sync navigation across all pages
        run: python sync_nav.py

      - name: Commit & push
        run: |
          chmod +x .github/scripts/push_data.sh
          .github/scripts/push_data.sh \
            "build: reviews.json 更新によるページ再ビルド" \
            docs/
