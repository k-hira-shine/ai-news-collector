name: Gemini Buzz One-off Research

on:
  workflow_dispatch:
    inputs:
      start:
        description: '検索開始日 YYYY-MM-DD'
        required: false
        default: '2025-06-10'
      end:
        description: '検索終了日 YYYY-MM-DD'
        required: false
        default: '2026-06-10'
      mode:
        description: '検索目的'
        required: false
        type: choice
        default: 'discovery'
        options:
          - discovery
          - usage
      query_profile:
        description: '検索クエリ群'
        required: false
        type: choice
        default: 'broad'
        options:
          - broad
          - features
          - feature-expansion
      refresh_costs_only:
        description: '既存runの費用だけ再取得する'
        required: false
        type: boolean
        default: false
      review_only:
        description: '既存候補をAI二次判定だけ実行する'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: repo-data-push
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run capped one-off research
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [[ "${{ inputs.refresh_costs_only }}" == "true" ]]; then
            python scripts/gemini_buzz_research.py --refresh-costs-only
          elif [[ "${{ inputs.review_only }}" == "true" ]]; then
            python scripts/gemini_buzz_research.py --review-only
          else
            python scripts/gemini_buzz_research.py \
              --mode "${{ inputs.mode || 'discovery' }}" \
              --query-profile "${{ inputs.query_profile || 'broad' }}" \
              --start "${{ inputs.start }}" \
              --end "${{ inputs.end }}" \
              --max-items-per-query 25 \
              --max-charge-usd 0.05
          fi
      - name: Sync navigation across all pages
        run: python sync_nav.py

      - name: Commit research snapshot
        run: |
          chmod +x .github/scripts/push_data.sh
          .github/scripts/push_data.sh \
            "research: Gemini buzz ${{ inputs.start }} to ${{ inputs.end }}" \
            data/gemini_buzz/ data/gemini_usage/ docs/
