name: AI News Collector

on:
  workflow_dispatch:          # 手動実行
    inputs:
      mode:
        description: '実行モード'
        required: false
        default: 'full'
        type: choice
        options:
          - full            # 収集 → 分析 → ダッシュボード生成
          - analyze-only    # 収集スキップ、既存データで分析＋ページ生成
          - dashboard-only  # ページ生成のみ（高速）
  schedule:
    - cron: '0 15 * * *'     # JST 00:00（1日2回）
    - cron: '0 7 * * *'      # JST 16:00（1日2回）

# data/docs への push を直列化する
concurrency:
  group: repo-data-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Install Japanese fonts (Noto CJK)
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-color-emoji
          fc-cache -f

      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: python -m playwright install --with-deps chromium

      - name: Run collector
        id: run_collector
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"
          if [ "$MODE" = "analyze-only" ]; then
            python main.py --analyze-only
          elif [ "$MODE" = "dashboard-only" ]; then
            python -c "import sys; sys.path.insert(0,'.'); from dashboard import generate_dashboard; generate_dashboard('docs/index.html'); print('AI news dashboard regenerated')"
          else
            if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 7 * * *" ]; then
              python main.py --x-mode light
            else
              python main.py --x-mode full
            fi
          fi

      - name: Build HN + arxiv page
        run: python build_hn.py

      - name: Build AI news portal page
        run: python build_home.py

      - name: Build legacy buzz ranking page
        if: ${{ vars.ENABLE_LEGACY_PORTAL_JOBS == 'true' && vars.ALLOW_LEGACY_COSTS == 'true' }}
        run: |
          if [ -f "data/buzz.json" ]; then
            python build_buzz.py
          else
            echo "data/buzz.json not found, skipping buzz page build"
          fi

      - name: Build legacy tools tracking page
        if: ${{ vars.ENABLE_LEGACY_PORTAL_JOBS == 'true' && vars.ALLOW_LEGACY_COSTS == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python build_tools.py

      - name: Collect legacy Gemini official sources
        if: ${{ vars.ENABLE_LEGACY_PORTAL_JOBS == 'true' && vars.ALLOW_LEGACY_COSTS == 'true' }}
        env:
          ALLOW_LEGACY_COSTS: "true"
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python gemini_collector.py

      - name: Build legacy Gemini tracker page
        if: ${{ vars.ENABLE_LEGACY_PORTAL_JOBS == 'true' && vars.ALLOW_LEGACY_COSTS == 'true' }}
        run: python build_gemini.py

      - name: Collect legacy Gemini Omni overseas posts
        if: >-
          vars.ENABLE_LEGACY_PORTAL_JOBS == 'true'
          && vars.ALLOW_LEGACY_COSTS == 'true'
          && (
            (github.event_name == 'schedule' && github.event.schedule == '0 15 * * *')
            || (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode || 'full') == 'full')
          )
        env:
          ALLOW_LEGACY_COSTS: "true"
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scripts/collect_gemini_omni_overseas.py

      - name: Build legacy Gemini Omni page
        if: ${{ vars.ENABLE_LEGACY_PORTAL_JOBS == 'true' && vars.ALLOW_LEGACY_COSTS == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python build_gemini_omni.py

      - name: Update Apify cost tracking
        if: always()
        run: python check_cost.py --record --quiet

      - name: Sync navigation across all pages
        if: always()
        run: python sync_nav.py

      - name: Commit & push data
        if: always()
        run: |
          chmod +x .github/scripts/push_data.sh
          .github/scripts/push_data.sh \
            "data: $(date -u +%Y-%m-%d_%H%M)" \
            data/ docs/

      - name: Send news summary email
        if: >-
          always()
          && steps.run_collector.outcome == 'success'
          && (
            github.event_name == 'schedule'
            || (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode || 'full') != 'dashboard-only')
          )
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DAILY_CHECK_EMAIL_TO: ${{ secrets.DAILY_CHECK_EMAIL_TO }}
          NEWS_EMAIL_TO: ${{ secrets.NEWS_EMAIL_TO }}
        run: python scripts/send_news_email.py
