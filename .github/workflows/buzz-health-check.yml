name: Buzz Daily Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: '15 19 * * *' # JST 04:15

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # 品質guardrail(warning)は buzz-collect の収集直後ステップが担当する。
      # 日次cronは収集途絶(>4日)のみ見張る＝stale行の品質warningで毎日失敗メールを出さない。
      - name: Check Buzz collection freshness (staleness only)
        run: python scripts/check_buzz_health.py --staleness-only
