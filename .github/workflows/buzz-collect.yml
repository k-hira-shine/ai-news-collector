name: Buzz Ranking Collector

on:
  workflow_dispatch:
    inputs:
      account:
        description: '追加するアカウント（@なし、空の場合は全アカウント更新）'
        required: false
        default: ''
      days:
        description: '日数を一時上書き（空欄ならprofile設定）'
        required: false
        default: ''
      profile:
        description: '収集プロファイル: auto / reduced / full'
        required: false
        default: 'auto'
  repository_dispatch:
    types: [buzz-add-account]
  schedule:
    - cron: '10 16 * * 0,2,4' # JST 月・水・金 01:10（UTCでは前日）

# collect / money と同時 push しない（main への書き込みを直列化）
concurrency:
  group: repo-data-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run buzz collector
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          # workflow_dispatch か repository_dispatch かで引数を分岐
          ACCOUNT="${{ github.event.inputs.account || github.event.client_payload.account }}"
          DAYS="${{ github.event.inputs.days || github.event.client_payload.days }}"
          PROFILE="${{ github.event.inputs.profile || github.event.client_payload.profile || 'auto' }}"
          EXTRA_ARGS=(--profile "$PROFILE")
          if [ -n "$DAYS" ]; then
            EXTRA_ARGS+=(--days "$DAYS")
          fi
          if [ -n "$ACCOUNT" ]; then
            python run_buzz.py --add "$ACCOUNT" "${EXTRA_ARGS[@]}"
          else
            python run_buzz.py "${EXTRA_ARGS[@]}"
          fi

      - name: Rebuild buzz.html
        run: python build_buzz.py

      - name: Update Apify cost tracking
        if: always()
        run: python check_cost.py --record --quiet

      - name: Sync navigation across all pages
        if: always()
        run: python sync_nav.py

      - name: Commit & push
        if: always()
        env:
          REBUILD_BUZZ: "true"
        run: |
          chmod +x .github/scripts/push_data.sh
          .github/scripts/push_data.sh \
            "buzz: $(date -u +%Y-%m-%d_%H%M) ${{ github.event.inputs.account }}" \
            data/buzz.json data/buzz_collection_metrics.jsonl data/logs/ data/cost_tracking.json docs/ config.yaml

      # 品質guardrailは収集直後の新鮮な行で1回だけ判定する（push後に実行＝データは常に保存される）。
      # 日次の Buzz Daily Health Check は --staleness-only で収集途絶のみ見張るため、stale行の重複アラートは出ない。
      - name: Verify buzz quality guardrails (fresh)
        if: always()
        run: python scripts/check_buzz_health.py
