name: Buzz Ranking Collector

on:
  workflow_dispatch:
    inputs:
      account:
        description: '追加するアカウント（@なし、空の場合は全アカウント更新）'
        required: false
        default: ''
      days:
        description: '何日前まで遡るか'
        required: false
        default: '30'
  repository_dispatch:
    types: [buzz-add-account]
  schedule:
    - cron: '10 17 * * 0,2,4' # JST 月・水・金 02:10（UTCでは前日）

# collect / money と同時 push しない（main への書き込みを直列化）
concurrency:
  group: repo-data-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run buzz collector
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          # workflow_dispatch か repository_dispatch かで引数を分岐
          ACCOUNT="${{ github.event.inputs.account || github.event.client_payload.account }}"
          DAYS="${{ github.event.inputs.days || github.event.client_payload.days || '30' }}"
          if [ -n "$ACCOUNT" ]; then
            python run_buzz.py --add "$ACCOUNT" --days "$DAYS" --max-items 100
          else
            python run_buzz.py --days "$DAYS" --max-items 100
          fi

      - name: Rebuild buzz.html with PAT embedded
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python build_buzz.py

      - name: Update Apify cost tracking
        run: python check_cost.py --record --quiet

      - name: Commit & push
        env:
          REBUILD_BUZZ: "true"
        run: |
          chmod +x .github/scripts/push_data.sh
          .github/scripts/push_data.sh \
            "buzz: $(date -u +%Y-%m-%d_%H%M) ${{ github.event.inputs.account }}" \
            data/buzz.json data/logs/ data/cost_tracking.json docs/buzz.html docs/run_status.json config.yaml
