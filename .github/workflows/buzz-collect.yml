name: Legacy Buzz Ranking Collector

on:
  workflow_dispatch:
    inputs:
      account:
        description: '追加するアカウント（@なし、空の場合は全アカウント更新）'
        required: false
        default: ''
      days:
        description: '日数を一時上書き（空欄ならprofile設定）'
        required: false
        default: ''
      profile:
        description: '収集プロファイル: auto / reduced / full'
        required: false
        default: 'auto'
      allow_costs:
        description: 'Legacy課金処理を明示的に許可する'
        required: false
        type: boolean
        default: false

# Legacy: AIニュース専用運用では手動実行のみ。main への書き込みを直列化
concurrency:
  group: repo-data-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  disabled:
    if: ${{ github.event.inputs.allow_costs != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Legacy buzz collector is disabled by default to avoid non-AI-news costs."

  collect:
    if: ${{ github.event.inputs.allow_costs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run buzz collector
        env:
          ALLOW_LEGACY_COSTS: "true"
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          ACCOUNT="${{ github.event.inputs.account }}"
          DAYS="${{ github.event.inputs.days }}"
          PROFILE="${{ github.event.inputs.profile || 'auto' }}"
          EXTRA_ARGS=(--profile "$PROFILE")
          if [ -n "$DAYS" ]; then
            EXTRA_ARGS+=(--days "$DAYS")
          fi
          if [ -n "$ACCOUNT" ]; then
            python run_buzz.py --add "$ACCOUNT" "${EXTRA_ARGS[@]}"
          else
            python run_buzz.py "${EXTRA_ARGS[@]}"
          fi

      - name: Rebuild buzz.html
        run: python build_buzz.py

      - name: Update Apify cost tracking
        if: always()
        run: python check_cost.py --record --quiet

      - name: Sync navigation across all pages
        if: always()
        run: python sync_nav.py

      - name: Commit & push
        if: always()
        env:
          REBUILD_BUZZ: "true"
        run: |
          chmod +x .github/scripts/push_data.sh
          .github/scripts/push_data.sh \
            "buzz: $(date -u +%Y-%m-%d_%H%M) ${{ github.event.inputs.account }}" \
            data/buzz.json data/buzz_collection_metrics.jsonl data/logs/ data/cost_tracking.json docs/ config.yaml

      # 品質guardrailは手動収集直後の新鮮な行で1回だけ判定する（push後に実行＝データは常に保存される）。
      - name: Verify buzz quality guardrails (fresh)
        if: always()
        run: python scripts/check_buzz_health.py
