name: Verify Stage1 Pro vs Flash

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-data-push
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run Pro vs Flash comparison
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/verify_stage1_flash.py
      - name: Commit result
        run: |
          chmod +x .github/scripts/push_data.sh
          .github/scripts/push_data.sh \
            "verify: stage1 Pro vs Flash comparison" \
            data/stage1_flash_verification.json data/gemini_usage/
