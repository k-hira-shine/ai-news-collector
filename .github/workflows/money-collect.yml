name: Legacy AI Money Cases Collector

on:
  workflow_dispatch:          # Legacy: AIニュース専用運用では手動実行のみ
    inputs:
      mode:
        description: '実行モード'
        required: false
        default: 'full'
        type: choice
        options:
          - full           # 収集 → 分析 → ページ生成
          - analyze-only   # 収集済みデータの分析のみ（再分析用）
          - page-only      # ページ生成のみ
      allow_costs:
        description: 'Legacy課金処理を明示的に許可する'
        required: false
        type: boolean
        default: false

# main への書き込みを直列化
concurrency:
  group: repo-data-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  disabled:
    if: ${{ github.event.inputs.allow_costs != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Legacy money collector is disabled by default to avoid non-AI-news costs."

  collect:
    if: ${{ github.event.inputs.allow_costs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run money collector
        env:
          ALLOW_LEGACY_COSTS: "true"
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_COOKIES: ${{ secrets.X_COOKIES }}
          XQUIK_API_KEY: ${{ secrets.XQUIK_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"
          if [ "$MODE" = "analyze-only" ]; then
            python run_money.py --analyze-only
          elif [ "$MODE" = "page-only" ]; then
            python run_money.py --page-only
          else
            python run_money.py
          fi

      - name: Update Apify cost tracking
        if: always()
        run: python check_cost.py --record --quiet

      - name: Sync navigation across all pages
        if: always()
        run: python sync_nav.py

      - name: Commit & push data
        if: always()
        run: |
          chmod +x .github/scripts/push_data.sh
          .github/scripts/push_data.sh \
            "money: $(date -u +%Y-%m-%d_%H%M)" \
            data/ docs/
