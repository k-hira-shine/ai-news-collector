name: Daily Ops Check

on:
  workflow_dispatch:
  schedule:
    - cron: '15 18 * * *' # JST 03:15

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Run daily ops check
        id: daily
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python daily_check.py --days 7 > daily_check.out 2>&1
          status=$?
          cat daily_check.out
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Send daily summary email
        if: always()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DAILY_CHECK_EMAIL_TO: ${{ secrets.DAILY_CHECK_EMAIL_TO }}
          DAILY_CHECK_STATUS: ${{ steps.daily.outputs.status }}
        run: python scripts/send_daily_check_email.py daily_check.out

      - name: Fail on daily ops issues
        if: steps.daily.outputs.status != '0'
        run: exit 1
